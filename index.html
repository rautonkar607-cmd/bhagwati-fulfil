<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bhagwati Fulfil | Client Portal</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    color:#172033;
}

.header{
    background:#111827;
    color:white;
    padding:22px 18px;
    text-align:center;
}

.logo{
    font-size:28px;
    font-weight:800;
}

.tagline{
    margin-top:6px;
    font-size:13px;
    color:#d1d5db;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 16px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
    margin-bottom:18px;
    font-size:20px;
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-size:13px;
    font-weight:bold;
}

input, select, textarea{
    width:100%;
    padding:13px;
    border:1px solid #d7dce5;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:85px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#111827;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    margin-top:20px;
    background:#111827;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.rate-box{
    background:#f3f4f6;
    border-radius:12px;
    padding:16px;
    margin-top:15px;
}

.rate{
    font-size:22px;
    font-weight:bold;
    margin-top:5px;
}

.tracking{
    text-align:center;
}

.track-input{
    margin-top:10px;
}

.footer{
    text-align:center;
    padding:25px;
    font-size:12px;
    color:#737b8c;
}

.success{
    display:none;
    background:#ecfdf3;
    color:#067647;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
    font-size:13px;
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">BHAGWATI FULFIL</div>
    <div class="tagline">
        D2C FULFILLMENT & LOGISTICS
    </div>
</header>

<div class="container">

    <!-- CLIENT ORDER -->
    <div class="card">

        <h2>📦 Create New Shipment</h2>

        <label>Client / Business Name</label>
        <input type="text" id="client" placeholder="Your business name">

        <label>Order ID</label>
        <input type="text" id="orderId" placeholder="Example: ORD001">

        <h3 style="margin-top:25px;">Pickup Details</h3>

        <label>Pickup Name</label>
        <input
