<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BHAGWATI FULFIL | Client Portal</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:22px 15px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:7px 0 0;
  color:#d1d5db;
}

.container{
  width:94%;
  max-width:850px;
  margin:25px auto;
}

.step{
  display:none;
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.step.active{
  display:block;
}

h2{
  margin-top:0;
  font-size:21px;
}

h3{
  margin-top:25px;
  font-size:17px;
  border-bottom:1px solid #ddd;
  padding-bottom:8px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#111827;
}

textarea{
  min-height:85px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.row3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:15px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:9px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#6b7280;
}

.success{
  text-align:center;
}

.success h2{
  color:green;
}

.order-box{
  background:#f3f4f6;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.rate-box{
  margin-top:20px;
  background:#eef2ff;
  padding:18px;
  border-radius:12px;
}

.rate-line{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}

.total{
  border-top:2px solid #555;
  margin-top:8px;
  padding-top:10px;
  font-size:20px;
  font-weight:bold;
}

.small{
  color:#666;
  font-size:13px;
  margin-top:5px;
}

.hidden{
  display:none;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#dbeafe;
  color:#1e40af;
  font-weight:bold;
}

@media(max-width:600px){
  .row,
  .row3{
    grid-template-columns:1fr;
    gap:0;
  }

  .step{
    padding:17px;
  }
}
</style>
</head>

<body>

<header>
  <h1>BHAGWATI FULFIL</h1>
  <p>Client Booking Portal</p>
</header>

<div class="container">

<!-- ================= STEP 1 ================= -->

  <h2>Step 1 — Client Details</h2>

  <label>Business / Client Name</label>
  <input id="clientName" type="text" placeholder="Enter business name">

  <label>Mobile Number</label>
  <input id="clientMobile" type="tel
