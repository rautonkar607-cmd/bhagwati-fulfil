<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHAGWATI FULFIL | Client Portal</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
.container{
  max-width:850px;
  margin:30px auto;
  padding:15px;
}
.card{
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:20px;
}
h1{text-align:center;margin:5px 0 8px}
h2{margin-top:0}
.subtitle{text-align:center;color:#666;margin-bottom:25px}

.step{display:none}
.step.active{display:block}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.full{grid-column:1/-1}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}
textarea{min-height:85px;resize:vertical}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}
.primary{background:#111;color:white}
.green{background:#16833b;color:white}
.gray{background:#ddd;color:#222}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.ratebox{
  background:#f7f7f7;
  padding:15px;
  border-radius:10px;
  margin-top:18px;
}
.ratebox p{
  margin:8px 0;
  display:flex;
  justify-content:space-between;
}
.total{
  font-size:22px;
  font-weight:bold;
  border-top:2px solid #ddd;
  padding-top:12px;
}
.success{
  background:#eaf8ee;
  border:1px solid #8bd09d;
  padding:18px;
  border-radius:10px;
}
.error{
  color:#c00;
  font-weight:bold;
  margin-top:10px;
}
.small{
  font-size:13px;
  color:#666;
}
.order{
  font-size:20px;
  font-weight:bold;
}
@media(max-width:600px){
  .grid,.row{grid-template-columns:1fr}
