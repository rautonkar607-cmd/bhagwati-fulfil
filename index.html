<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHAGWATI FULFIL | Client Portal</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#111827;
}
.header{
  background:#111827;
  color:#fff;
  padding:22px 15px;
  text-align:center;
}
.header h1{margin:0;font-size:26px}
.header p{margin:6px 0 0;color:#cbd5e1}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin:0 0 16px;
  font-size:19px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin:12px 0 6px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  background:#fff;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:9px;
  margin-top:12px;
  padding:13px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

.primary{background:#111827;color:#fff}
.green{background:#16a34a;color:#fff}
.gray{background:#e5e7eb;color:#111827}

.summary{
  background:#f8fafc;
  border-radius:10px;
  padding:15px;
  line-height:2;
}

.total{
  border-top:1px solid #ddd;
  margin-top:8px;
  padding-top:10px;
  font-size:22px;
  font-weight:bold;
}

.status{
  display:none;
  padding:13px;
  border-radius:8px;
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}
