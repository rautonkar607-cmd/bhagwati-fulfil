<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BHAGWATI FULFIL | Client Portal</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
color:#172033;
}

.header{
background:#111827;
color:white;
padding:22px 15px;
text-align:center;
border-bottom:4px solid #ff6a00;
}

.logo{
font-size:28px;
font-weight:900;
}

.logo span{
color:#ff6a00;
}

.tagline{
font-size:12px;
color:#d1d5db;
margin-top:5px;
}

.container{
max-width:720px;
margin:20px auto;
padding:0 14px;
}

.card{
background:#fff;
border-radius:18px;
padding:20px;
margin-bottom:18px;
box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.page{
display:none;
}

.page.active{
display:block;
}

.stepbar{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
margin-bottom:18px;
}

.step{
padding:10px 4px;
text-align:center;
border-radius:8px;
background:#e5e7eb;
font-size:11px;
font-weight:bold;
}

.step.active{
background:#ff6a00;
color:white;
}

h2{
font-size:21px;
margin-bottom:18px;
}

h3{
font-size:16px;
margin:22px 0 8px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin:13px 0 6px;
}

input,select,textarea{
width:100%;
padding:13px;
border:1px solid #d6dbe3;
border-radius:10px;
font-size:15px;
outline:none;
}

input:focus,select:focus,textarea:focus{
border-color:#ff6a00;
}

textarea{
min-height:80px;
resize:vertical;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
width:100%;
border:0;
border-radius:11px;
padding:14px;
margin-top:16px;
background:#111827;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.orange{
background:#ff6a00;
}

.green{
background:#087443;
}

.gray{
background:#667085;
}

.notice{
background:#fff7ed;
border:1px solid #fed7aa;
padding:12px;
border-radius:10px;
margin-top:14px;
font-size:13px;
line-height:1.5;
}

.saved{
background:#eff6ff;
border:1px solid #bfdbfe;
padding:14px;
border-radius:11px;
font-size:13px;
line-height:1.6;
}

.rate-box{
background:#f8fafc;
border:1px solid #e5e7eb
