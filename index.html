<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHAGWATI FULFIL | Client Portal</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
.header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}
.header h1{margin:0;font-size:25px}
.orange{color:#ff7900}

.container{
  max-width:850px;
  margin:25px auto;
  padding:0 15px;
}
.card{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}
h2{margin-top:0}
.step{
  display:none;
}
.step.active{
  display:block;
}
label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}
textarea{
  min-height:80px;
  resize:vertical;
}
.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.row3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
button{
  border:0;
  border-radius:9px;
  padding:13px 20px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:18px;
}
.primary{
  background:#ff7900;
  color:white;
}
.secondary{
  background:#222;
  color:white;
}
.green{
  background:#16883d;
  color:white;
}
button:active{
  transform:scale(.98);
}
.nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.info{
  background:#fff7ed;
  border-left:4px solid #ff7900;
  padding:12px;
  border-radius:6px;
  margin:15px 0;
}
.ratebox{
  background:#f7f7f7;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}
.price{
  font-size:27px;
  font-weight:bold;
  color:#16883d;
}
.success{
  text-align:center;
  background:#ecfff2;
  border:1px solid #a8e5bb;
  padding:20px;
  border-radius:12px;
}
.small{
  color:#666;
  font-size:13px;
}
.hidden{display:none}

@media(max-width:600px){
  .row,.row3{
    grid-template-columns:1fr;
  }
  .nav{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>BHAGWATI <span class="orange">FULFIL</span></h1>
  <div>Client Booking Portal</div>
</div>

<div class="container">

<!-- ================= STEP 1 ================= -->

<div id="step1" class="step active">
<div
