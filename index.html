<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BHAGWATI FULFIL | Client Portal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

.header{
  background:#111827;
  color:white;
  padding:18px 20px;
  text-align:center;
}

.header h1{
  font-size:25px;
  letter-spacing:1px;
}

.header p{
  margin-top:5px;
  font-size:12px;
  color:#cbd5e1;
}

.container{
  width:94%;
  max-width:850px;
  margin:25px auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.card h2{
  font-size:20px;
  margin-bottom:18px;
}

.card h3{
  margin-bottom:12px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:12px 0 6px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d6dbe5;
  border-radius:10px;
  outline:none;
  font-size:14px;
  background:#fff;
}

input:focus,select:focus,textarea:focus{
  border-color:#111827;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  width:100%;
  border:none;
  padding:14px;
  border-radius:10px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.btn-primary{
  background:#111827;
  color:white;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn-success{
  background:#15803d;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.hidden{
  display:none !important;
}

.step{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.step div{
  flex:1;
  padding:9px 5px;
  border-radius:8px;
  background:#e5e7eb;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}

.step .active{
  background:#111827;
  color:white;
}

.saved-box{
  background:#f1f5f9;
  border-radius:12px;
  padding:15px;
  margin-bottom:18px;
}

.saved-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0;
  border-bottom:1px solid #e2e8f0;
  font-size:13px;
}

.saved-row:last-child{
  border-bottom:none;
}

.saved-row span:first-child{
  color:#64748b;
}

.saved-row span:last-child{
  font-weight:bold;
  text-align:right;
}

.rate-box{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:16px;
  margin-top:15px;
}

.rate-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  font-size:14px;
}

.rate-row.total{
  border-top:1px solid #cbd5e1;
  margin-top:8px;
  padding-top:13px;
  font-size:18px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  background:#e2e8f0;
}

.success{
  text-align:center;
  padding:30px 15px;
}

.success-icon{
  font-size:55px;
  margin-bottom:10px;
}

.success h2{
  color:#15803d;
}

.order-id{
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.note{
  background:#fff7ed;
  border-left:4px solid #f97316;
  padding:12px;
  border-radius:8px;
  font-size:12px;
  margin-top:12px;
}

.error{
  color:#dc2626;
  font-size:12px;
  margin-top:5px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f8fafc;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

.stat small{
  color:#64748b;
}

.review-item{
  padding:10px 0;
  border-bottom:1px solid #e5e7eb;
  font-size:14px;
}

.review-item:last-child{
  border-bottom:none;
}

.footer{
  text-align:center;
  color:#64748b;
  font-size:12px;
  padding:20px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .dashboard-grid{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:17px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>BHAGWATI FULFIL</h1>
  <p>D2C PICKUP & DELIVERY SERVICES</p>
</header>

<div class="container">

  <!-- ================= PROFILE PAGE ================= -->

  <section id="profilePage" class="card">

    <h2 id="profileTitle">Client Profile</h2>

    <div class="note">
      First time? Fill your profile once. Your details will be saved for future shipments.
    </div>

    <label>Client / Business Name *</label>
    <input id="clientName" type="text" placeholder="Enter client or business name">

    <label>Mobile Number *</label>
    <input id="clientMobile" type="tel" maxlength="10" placeholder="10 digit mobile number">

    <label>Pickup Address *</label>
    <textarea id="pickupAddress" placeholder="Enter complete pickup address"></textarea>

    <div class="grid">

      <div>
        <label>Pickup City *</label>
        <input id="pickupCity" type="text" placeholder="Pune">
      </div>

      <div>
        <label>Pickup Pincode *</label>
        <input id="pickupPin" type="text" maxlength="6" placeholder="411001">
      </div>

    </div>

    <h3 style="margin-top:22px;">Bank Settlement Details</h3>

    <label>Account Holder Name *</label>
    <input id="accountHolder" type="text" placeholder="As per bank account">

    <label>Bank Account Number *</label>
    <input id="accountNumber" type="password" placeholder="Enter account number">

    <label>IFSC Code *</label>
    <input id="ifsc" type="text" placeholder="Example: SBIN0001234">

    <label>Bank Name *</label>
    <input id="bankName" type="text" placeholder="Bank name">
