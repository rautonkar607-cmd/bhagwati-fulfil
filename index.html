<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BHAGWATI FULFIL</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f9;
}
.header{
  background:#111827;
  color:white;
  padding:30px;
  text-align:center;
}
h1{
  margin:0;
}
.orange{
  color:#ff6a00;
}
.card{
  background:white;
  max-width:600px;
  margin:25px auto;
  padding:25px;
  border-radius:15px;
}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  box-sizing:border-box;
}
button{
  background:#ff6a00;
  color:white;
  border:0;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <h1>BHAGWATI <span class="orange">FULFIL</span></h1>
  <p>D2C FULFILLMENT & LOGISTICS</p>
</div>

<div class="card">

<h2>Client Portal</h2>

<input id="name" placeholder="Client / Business Name">

<input id="mobile" placeholder="Mobile Number">

<button onclick="testBooking()">
SAVE & CONTINUE
</button>

<div id="result"></div>

</div>

<script>

function testBooking(){

  let name=document.getElementById("name").value;
  let mobile=document.getElementById("mobile").value;

  if(name==="" || mobile===""){
    alert("Please fill details");
    return;
  }

  document.getElementById("result").innerHTML=
  "<h3>✅ Page Working</h3>"+
  "<p>Client: "+name+"</p>"+
  "<p>Mobile: "+mobile+"</p>";

}

</script>

</body>
</html>
